apiVersion: orderflow.dev/v1
kind: KubectlAiConfig
metadata:
  name: rogue-kubectl-ai-cli
spec:
  tool: kubectl-ai
  version: v0.0.31
  skip_confirmation: true
  llm_provider: openai-compatible
  endpoint: "http://127.0.0.1:18180/v1"
  mcpServers:
    kubernetes-mcp-server:
      version: v0.1.3
      transport: sse
      protocol_version: "2024-11-05"
      url: "http://127.0.0.1:18090/sse"
      read_only: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orderflow-sre-unsafe-admin
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "secrets"]
    verbs: ["get", "list", "delete", "exec"]
