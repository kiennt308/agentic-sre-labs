apiVersion: orderflow.dev/v1
kind: KubectlAiConfig
metadata:
  name: orderflow-diag-cli
spec:
  tool: kubectl-ai
  version: v0.0.31
  autonomy_level: 0
  skip_confirmation: false
  llm_provider: openai-compatible
  endpoint: "http://127.0.0.1:18180/v1"
  model: orderflow-sre-replay-v1
  namespace: orderflow-prod
  rbac_role: orderflow-sre-readonly
  mcpServers:
    kubernetes-mcp-server:
      version: v0.1.3
      transport: streamable-http
      protocol_version: "2026-07-28"
      url: "http://127.0.0.1:18090/mcp"
      read_only: true
      allowed_tools:
        - pods_get
        - pods_list
        - pods_log
        - events_list
