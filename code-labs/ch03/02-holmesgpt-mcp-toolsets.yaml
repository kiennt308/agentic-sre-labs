# 02-holmesgpt-mcp-toolsets.yaml
# HolmesGPT v0.46.0 alert-driven MCP configuration with allowed_tools.
# Copyright (c) 2026 Kien Nguyen. Licensed under Apache-2.0.
apiVersion: holmesgpt.dev/v1
kind: HolmesConfig
metadata:
  name: orderflow-alert-investigator
  namespace: orderflow-sre
spec:
  version: "v0.46.0"
  agent_runtime: "holmesgpt"
  trigger_type: "mwmbr_burn_rate"
  alert_source: "alertmanager-v0.35.0"
  webhook_endpoint: "http://127.0.0.1:8080/api/v1/alertmanager"
  autonomy_level: 1
  runbook_policy:
    max_tool_calls: 12
    require_citations: true
  mcpServers:
    prometheus-mcp:
      version: "v0.19.0"
      transport: "streamable-http"
      url: "http://127.0.0.1:18091/mcp"
      read_only: true
      allowed_tools:
        - "execute_query"
        - "execute_range_query"
        - "list_metrics"
        - "get_targets"
    mcp-grafana:
      version: "v2.0.2"
      transport: "streamable-http"
      url: "http://127.0.0.1:18092/mcp"
      read_only: true
      allowed_tools:
        - "query_prometheus"
        - "query_loki_logs"
        - "get_dashboard_by_uid"
    kubernetes-mcp-server:
      version: "v0.1.3"
      transport: "streamable-http"
      url: "http://127.0.0.1:18093/mcp"
      read_only: true
      allowed_tools:
        - "pods_list"
        - "pods_get"
        - "pods_log"
        - "events_list"
